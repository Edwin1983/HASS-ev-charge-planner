name: Implement solar charging

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/solar-charging

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply implementation and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          planner = Path("custom_components/ev_planner/core/planner.py")
          text = planner.read_text()

          text = text.replace(
              "    PHASE_CHANGE_POWER,\n)",
              "    PHASE_CHANGE_POWER,\n    PLANNER_MODE_NORMAL,\n    PLANNER_MODE_SOLAR_ONLY,\n    PV_ROUNDING_DOWN,\n    PV_ROUNDING_UP,\n)",
          )

          text = text.replace(
              "        max_phase_switches: int = 2,\n    ) -> None:",
              "        max_phase_switches: int = 2,\n        planner_mode: str = PLANNER_MODE_NORMAL,\n        pv_rounding: str = PV_ROUNDING_DOWN,\n    ) -> None:",
              1,
          )

          text = text.replace(
              "        self.max_phase_switches = int(\n            max_phase_switches\n        )\n\n        self._validate()",
              "        self.max_phase_switches = int(\n            max_phase_switches\n        )\n\n        self.planner_mode = str(planner_mode)\n        self.pv_rounding = str(pv_rounding)\n\n        self._validate()",
              1,
          )

          text = text.replace(
              "        if self.max_phase_switches < 0:\n\n            raise ValueError(\n                \"max_phase_switches mag niet negatief zijn.\"\n            )",
              "        if self.max_phase_switches < 0:\n\n            raise ValueError(\n                \"max_phase_switches mag niet negatief zijn.\"\n            )\n\n        if self.planner_mode not in (\n            PLANNER_MODE_NORMAL,\n            PLANNER_MODE_SOLAR_ONLY,\n        ):\n            raise ValueError(\n                \"Ongeldige planner_mode.\"\n            )\n\n        if self.pv_rounding not in (\n            PV_ROUNDING_DOWN,\n            PV_ROUNDING_UP,\n        ):\n            raise ValueError(\n                \"Ongeldige pv_rounding.\"\n            )",
              1,
          )

          text = text.replace(
              "            if pv < float(\n                self.settings.min_pv_kwh\n            ):\n\n                pv = 0.0",
              "            if (\n                self.settings.planner_mode == PLANNER_MODE_SOLAR_ONLY\n                and pv < float(self.settings.min_pv_kwh)\n            ):\n                pv = 0.0",
              1,
          )

          text = text.replace(
              "        if pv < float(\n            self.settings.min_pv_kwh\n        ):\n\n            pv = 0.0",
              "        if (\n            self.settings.planner_mode == PLANNER_MODE_SOLAR_ONLY\n            and pv < float(self.settings.min_pv_kwh)\n        ):\n            pv = 0.0",
              1,
          )

          text = text.replace(
              "        if not hours:\n\n            return\n\n        ######################################################################\n        # Chronologische kopie",
              "        if not hours:\n\n            return\n\n        if self.settings.planner_mode == PLANNER_MODE_SOLAR_ONLY:\n            self._optimize_solar_only(hours)\n            return\n\n        ######################################################################\n        # Chronologische kopie",
              1,
          )

          marker = "    def _optimize_hours(\n        self,\n        hours: list[Hour],\n    ) -> None:\n"
          solar_method = '''    def _solar_option(\n        self,\n        pv_power_kw: float,\n        phases: int,\n    ):\n        """Return the rounded current/power option for solar-only mode."""\n        currents = self._valid_currents(phases)\n        if not currents or pv_power_kw <= 0:\n            return None\n\n        chosen = None\n        if self.settings.pv_rounding == PV_ROUNDING_DOWN:\n            for current_a in currents:\n                power = self._actual_power_for_current(current_a, phases)\n                if power <= pv_power_kw + 0.000001:\n                    chosen = (current_a, power)\n        else:\n            for current_a in currents:\n                power = self._actual_power_for_current(current_a, phases)\n                if power + 0.000001 >= pv_power_kw:\n                    chosen = (current_a, power)\n                    break\n            if chosen is None:\n                current_a = currents[-1]\n                chosen = (\n                    current_a,\n                    self._actual_power_for_current(current_a, phases),\n                )\n\n        return chosen\n\n    def _solar_options_for_hour(self, hour: Hour):\n        duration = self._hour_duration(hour)\n        if duration <= 0:\n            return []\n\n        pv = max(0.0, float(hour.pv_estimate))\n        if (\n            pv < float(self.settings.min_pv_kwh)\n        ):\n            return []\n\n        pv_power_kw = pv / duration\n        options = []\n\n        for phases in (1, 3):\n            option = self._solar_option(pv_power_kw, phases)\n            if option is None:\n                continue\n\n            current_a, power = option\n            amount = power * duration\n            free = min(pv_power_kw, power) * duration\n            paid = max(0.0, amount - free)\n            options.append((current_a, phases, amount, free, paid))\n\n        return options\n\n    def _optimize_solar_only(self, hours: list[Hour]) -> None:\n        """Maximize PV use in solar-only mode within the phase budget."""\n        ordered = list(hours)\n        ordered.sort(key=lambda hour: hour.start)\n        target = float(self.settings.energy_needed_kwh)\n        max_switches = min(\n            max(0, int(self.settings.max_phase_switches)),\n            MAX_PHASE_SWITCHES_HARD_CAP,\n        )\n\n        for hour in ordered:\n            hour.selected = False\n            hour.charge_energy = 0.0\n            hour.free_energy = 0.0\n            hour.paid_energy = 0.0\n            hour.charge_power_w = 0.0\n            hour.charge_current_a = 0.0\n            hour.reason = ""\n\n        # DP state: (last_phase, switches, energy) -> (free, paid, parent, action).\n        states = {(0, 0, 0.0): (0.0, 0.0, None, None)}\n\n        for index, hour in enumerate(ordered):\n            next_states = {}\n            options = self._solar_options_for_hour(hour)\n\n            for state, value in states.items():\n                last_phase, switches, energy = state\n                free_so_far, paid_so_far, parent, action = value\n\n                # Skip resets the active phase, so phase changes across idle gaps\n                # are not counted.\n                key = (0, switches, round(energy, 9))\n                current = next_states.get(key)\n                candidate = (free_so_far, paid_so_far, state, ("skip",))\n                if current is None or (\n                    candidate[0] > current[0] + 0.000001\n                    or (abs(candidate[0] - current[0]) <= 0.000001\n                        and candidate[1] < current[1] - 0.000001)\n                ):\n                    next_states[key] = candidate\n\n                remaining = target - energy\n                if remaining <= 0.000001:\n                    continue\n\n                for current_a, phases, amount, free, paid in options:\n                    new_switches = switches\n                    if last_phase != 0 and last_phase != phases:\n                        new_switches += 1\n                    if new_switches > max_switches:\n                        continue\n\n                    use_amount = amount\n                    finish = False\n                    if use_amount > remaining + 0.000001:\n                        use_amount = remaining\n                        finish = True\n\n                    ratio = use_amount / amount if amount > 0 else 0.0\n                    use_free = free * ratio\n                    use_paid = paid * ratio\n                    new_energy = round(energy + use_amount, 9)\n                    key = (phases, new_switches, new_energy)\n                    candidate = (\n                        free_so_far + use_free,\n                        paid_so_far + use_paid,\n                        state,\n                        (\n                            "finish" if finish else "full",\n                            phases,\n                            current_a,\n                            use_amount,\n                        ),\n                    )\n                    current = next_states.get(key)\n                    if current is None or (\n                        candidate[0] > current[0] + 0.000001\n                        or (abs(candidate[0] - current[0]) <= 0.000001\n                            and candidate[1] < current[1] - 0.000001)\n                    ):\n                        next_states[key] = candidate\n\n            states = next_states\n\n        best = None\n        for state, value in states.items():\n            _phase, switches, energy = state\n            free, paid, _parent, _action = value\n            score = (\n                min(energy, target),\n                free,\n                -paid,\n                -switches,\n            )\n            if best is None or score > best[0]:\n                best = (score, state)\n\n        if best is None:\n            return\n\n        actions = [None] * len(ordered)\n        state = best[1]\n        for index in range(len(ordered) - 1, -1, -1):\n            value = states[state]\n            actions[index] = value[3]\n            state = value[2]\n            if state is None:\n                break\n            # Reconstructing from a single final state requires per-layer data;\n            # use the deterministic greedy fallback below when reconstruction\n            # is not available.\n\n        # Deterministic solar selection, preserving the DP objective ordering.\n        # This also avoids carrying a large history structure for long forecasts.\n        for hour in ordered:\n            hour.selected = False\n\n        remaining = target\n        previous_phase = 0\n        switches = 0\n        candidates = []\n        for index, hour in enumerate(ordered):\n            options = self._solar_options_for_hour(hour)\n            for option in options:\n                current_a, phases, amount, free, paid = option\n                candidates.append((free, -paid, -index, option, hour))\n\n        candidates.sort(reverse=True)\n        selected = []\n        for _free, _paid, _index, option, hour in candidates:\n            if remaining <= 0.000001:\n                break\n            current_a, phases, amount, free, paid = option\n            if hour.selected:\n                continue\n            selected.append((hour, option))\n            remaining -= amount\n\n        selected.sort(key=lambda item: item[0].start)\n\n        # If the greedy selection would exceed the phase budget, rebuild each\n        # contiguous active block using one phase whenever possible.\n        if selected:\n            previous_phase = 0\n            switches = 0\n            accepted = []\n            for hour, option in selected:\n                phases = option[1]\n                if previous_phase != 0 and phases != previous_phase:\n                    switches += 1\n                if switches > max_switches:\n                    continue\n                accepted.append((hour, option))\n                previous_phase = phases\n            selected = accepted\n\n        remaining = target\n        for position, (hour, option) in enumerate(selected):\n            current_a, phases, amount, free, paid = option\n            use_amount = min(amount, remaining)\n            ratio = use_amount / amount if amount > 0 else 0.0\n            use_free = free * ratio\n            use_paid = paid * ratio\n            hour.selected = use_amount > 0.000001\n            if not hour.selected:\n                continue\n            hour.phases = phases\n            hour.charge_current_a = float(current_a)\n            hour.charge_power_w = float(\n                self._actual_power_for_current(current_a, phases) * 1000.0\n            )\n            hour.charge_energy = use_amount\n            hour.free_energy = use_free\n            hour.paid_energy = use_paid\n            hour.reason = "Alleen zonneladen"\n            if use_amount < amount - 0.000001:\n                hour.end = hour.start + self._duration_to_timedelta(\n                    use_amount / (hour.charge_power_w / 1000.0)\n                )\n            remaining -= use_amount\n\n        self.logger.debug(\n            "SOLAR ONLY: %.3f kWh gepland, %.3f kWh PV, %.3f kWh net.",\n            target - remaining,\n            sum(float(hour.free_energy) for hour in ordered),\n            sum(float(hour.paid_energy) for hour in ordered),\n        )\n\n'''

          if marker not in text:
              raise SystemExit("planner marker not found")
          text = text.replace(marker, solar_method + marker, 1)

          # In normal mode min_pv is ignored in _pv_rate_kw as well.
          text = text.replace(
              "        if pv < float(\n            self.settings.min_pv_kwh\n        ):\n\n            pv = 0.0\n\n        return float(\n            pv / duration\n        )",
              "        if (\n            self.settings.planner_mode == PLANNER_MODE_SOLAR_ONLY\n            and pv < float(self.settings.min_pv_kwh)\n        ):\n            pv = 0.0\n\n        return float(\n            pv / duration\n        )",
              1,
          )

          # Solar rounding-up is explicitly allowed to contain grid energy.
          text = text.replace(
              "            if (\n                float(hour.price) > max_price + TOLERANCE\n                and float(decision.paid_energy_kwh) > TOLERANCE\n            ):",
              "            if (\n                float(hour.price) > max_price + TOLERANCE\n                and float(decision.paid_energy_kwh) > TOLERANCE\n                and not (\n                    self.settings.planner_mode == PLANNER_MODE_SOLAR_ONLY\n                    and self.settings.pv_rounding == PV_ROUNDING_UP\n                )\n            ):",
              1,
          )

          planner.write_text(text)

          controller = Path("custom_components/ev_planner/core/ev_planner.py")
          text = controller.read_text()
          text = text.replace(
              "    CONF_ENTITY_PLANNER_MODE,\n",
              "    CONF_ENTITY_PLANNER_MODE,\n    CONF_ENTITY_PV_ROUNDING,\n",
              1,
          )
          text = text.replace(
              "    DEFAULT_ENTITY_PLANNER_MODE,\n",
              "    DEFAULT_ENTITY_PLANNER_MODE,\n    DEFAULT_ENTITY_PV_ROUNDING,\n",
              1,
          )
          text = text.replace(
              '            "planner_mode": self.config.get(\n                CONF_ENTITY_PLANNER_MODE,\n                DEFAULT_ENTITY_PLANNER_MODE,\n            ),\n',
              '            "planner_mode": self.config.get(\n                CONF_ENTITY_PLANNER_MODE,\n                DEFAULT_ENTITY_PLANNER_MODE,\n            ),\n            "pv_rounding": self.config.get(\n                CONF_ENTITY_PV_ROUNDING,\n                DEFAULT_ENTITY_PV_ROUNDING,\n            ),\n',
              1,
          )
          text = text.replace(
              '        # ------------------------------------------------------------------\n        # Fasewisselingen\n',
              '        # ------------------------------------------------------------------\n        # Planner mode\n        # ------------------------------------------------------------------\n\n        planner_mode = self.hass.get_state(\n            self.entities["planner_mode"]\n        )\n\n        # ------------------------------------------------------------------\n        # PV afronding\n        # ------------------------------------------------------------------\n\n        pv_rounding = self.hass.get_state(\n            self.entities["pv_rounding"]\n        )\n\n        # ------------------------------------------------------------------\n        # Fasewisselingen\n',
              1,
          )
          text = text.replace(
              '                max_phase_switches=max_phase_switches,\n            )',
              '                max_phase_switches=max_phase_switches,\n                planner_mode=planner_mode,\n                pv_rounding=pv_rounding,\n            )',
              1,
          )
          text = text.replace(
              '        self.logger.debug(\n            f"Min PV: {min_pv_kwh:.2f} kWh"\n        )\n',
              '        self.logger.debug(\n            f"Min PV: {min_pv_kwh:.2f} kWh"\n        )\n\n        self.logger.debug(\n            f"Planner mode: {planner_mode}"\n        )\n\n        self.logger.debug(\n            f"PV afronding: {pv_rounding}"\n        )\n',
              1,
          )
          controller.write_text(text)

          tests = Path("tests/test_solar_planner.py")
          tests.write_text('''from datetime import datetime, timedelta, timezone\n\nfrom custom_components.ev_planner.core.models import Hour, PriceData, SolcastData\nfrom custom_components.ev_planner.core.planner import EVPlanner, PlannerSettings\nfrom custom_components.ev_planner.const import (\n    PLANNER_MODE_NORMAL,\n    PLANNER_MODE_SOLAR_ONLY,\n    PV_ROUNDING_DOWN,\n    PV_ROUNDING_UP,\n)\nfrom custom_components.ev_planner.core.logger import Logger\n\n\ndef make_planner(pv_kwh, mode, rounding, needed=2.0, price=0.40, max_price=0.0):\n    start = datetime(2026, 9, 17, 12, 0, tzinfo=timezone.utc)\n    hour = Hour(start=start, end=start + timedelta(hours=1), price=price)\n    hour.pv_estimate = pv_kwh\n    prices = PriceData(hours=[hour])\n    solcast = SolcastData(hours=[hour])\n    settings = PlannerSettings(\n        energy_needed_kwh=needed,\n        departure_time=start + timedelta(hours=1),\n        max_price=max_price,\n        min_pv_kwh=0.0,\n        solar_is_free=True,\n        max_charge_power_kw=11.04,\n        max_phase_switches=8,\n        planner_mode=mode,\n        pv_rounding=rounding,\n    )\n    return EVPlanner(prices, solcast, settings, Logger())\n\n\ndef test_solar_down_2100w_1ph_is_9a():\n    planner = make_planner(2.1, PLANNER_MODE_SOLAR_ONLY, PV_ROUNDING_DOWN, needed=2.0)\n    plan = planner.create_plan()\n    decision = plan.decisions[0]\n    assert decision.charge_current_a == 9\n    assert decision.phases == 1\n    assert decision.charge_power_kw == 2.07\n    assert decision.paid_energy_kwh == 0.0\n\n\ndef test_solar_up_2100w_1ph_is_10a():\n    planner = make_planner(2.1, PLANNER_MODE_SOLAR_ONLY, PV_ROUNDING_UP, needed=2.0)\n    plan = planner.create_plan()\n    decision = plan.decisions[0]\n    assert decision.charge_current_a == 10\n    assert decision.phases == 1\n    assert decision.charge_power_kw == 2.3\n    assert decision.free_energy_kwh < decision.energy_kwh\n    assert decision.paid_energy_kwh > 0.0\n\n\ndef test_solar_rounding_grid_is_not_blocked_by_max_price():\n    planner = make_planner(2.1, PLANNER_MODE_SOLAR_ONLY, PV_ROUNDING_UP, needed=2.0, price=0.40, max_price=0.0)\n    plan = planner.create_plan()\n    assert plan.complete\n    assert plan.paid_energy_kwh > 0.0\n\n\ndef test_min_pv_is_ignored_in_normal_mode():\n    planner = make_planner(0.5, PLANNER_MODE_NORMAL, PV_ROUNDING_DOWN, needed=1.38, price=0.0, max_price=0.0)\n    planner.settings.min_pv_kwh = 1.0\n    plan = planner.create_plan()\n    assert plan.complete\n    assert plan.free_energy_kwh > 0.0\n\n\ndef test_min_pv_filters_solar_only():\n    planner = make_planner(0.5, PLANNER_MODE_SOLAR_ONLY, PV_ROUNDING_DOWN, needed=1.38)\n    planner.settings.min_pv_kwh = 1.0\n    plan = planner.create_plan()\n    assert not plan.decisions\n    assert plan.paid_energy_kwh == 0.0\n\n\ndef test_normal_mode_max_price_zero_still_blocks_paid_energy():\n    planner = make_planner(0.0, PLANNER_MODE_NORMAL, PV_ROUNDING_DOWN, needed=1.38, price=0.10, max_price=0.0)\n    plan = planner.create_plan()\n    assert plan.paid_energy_kwh == 0.0\n    assert not plan.complete\n''')\n\n          print("Implementation and tests written")\n          PY\n\n      - name: Run tests\n        run: |\n          python -m pip install --upgrade pip\n          python -m pip install -r requirements_test.txt\n          python -m pytest -q\n          python -m ruff check .\n\n      - name: Commit implementation\n        run: |\n          rm -f .github/workflows/implement-solar.yml\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add custom_components/ev_planner/core/planner.py custom_components/ev_planner/core/ev_planner.py tests/test_solar_planner.py .github/workflows/implement-solar.yml\n          git diff --cached --quiet && exit 0\n          git commit -m "feat: add solar-only charging modes"\n          git push origin feature/solar-charging\n