name: EV Planner Tests

run-name: EV Planner Tests - performance=${{ inputs.performance }}

on:
  push:
    branches:
      - main
      - experiment/quarter-hour-dp
      - experiment/array-dp
      - experiment/array-dp-fast-loop
      - experiment/dp-memory-profile
      - experiment/ha-planner-fast-loop
      - experiment/ha-planner-array-hotloop
      - experiment/ha-planner-hotloop-cost-delta
      - experiment/ha-planner-hotloop-action-limit
      - 'release/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      performance:
        description: "Run the 57 kWh quarter-hour performance benchmark"
        required: false
        default: false
        type: boolean

jobs:
  performance-ab:
    name: Performance A/B - ${{ matrix.label }}
    if: inputs.performance == true || github.ref == 'refs/heads/experiment/array-dp-fast-loop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: array-dp
            ref: experiment/array-dp
          - label: array-dp-fast-loop
            ref: experiment/array-dp-fast-loop
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      EV_PLANNER_RUN_PERFORMANCE: "1"
      EV_PLANNER_RUN_PROFILE: "0"

    steps:
      - name: Checkout benchmark revision
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Use current benchmark test
        run: |
          git fetch origin experiment/array-dp:refs/remotes/origin/experiment/array-dp
          git show origin/experiment/array-dp:tests/test_quarter_hour_optimizer_performance.py > tests/test_quarter_hour_optimizer_performance.py

      - name: Run benchmark
        run: |
          python -m pytest -q tests/test_quarter_hour_optimizer_performance.py::test_57kwh_quarter_hour_dp_performance -s

  performance-ab-array-hotloop:
    name: Performance A/B - array-hotloop ${{ matrix.label }}
    if: github.ref == 'refs/heads/experiment/ha-planner-array-hotloop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: array-dp-fast-loop
            ref: experiment/array-dp-fast-loop
          - label: array-hotloop
            ref: experiment/ha-planner-array-hotloop
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      EV_PLANNER_RUN_PERFORMANCE: "1"
      EV_PLANNER_RUN_PROFILE: "0"

    steps:
      - name: Checkout benchmark revision
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Use current benchmark test
        run: |
          git fetch origin experiment/array-dp:refs/remotes/origin/experiment/array-dp
          git show origin/experiment/array-dp:tests/test_quarter_hour_optimizer_performance.py > tests/test_quarter_hour_optimizer_performance.py

      - name: Run benchmark
        run: |
          python -m pytest -q tests/test_quarter_hour_optimizer_performance.py::test_57kwh_quarter_hour_dp_performance -s

  performance-ab-hotloop-cost-delta:
    name: Performance A/B - hotloop-cost-delta ${{ matrix.label }}
    if: github.ref == 'refs/heads/experiment/ha-planner-hotloop-cost-delta'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: array-hotloop
            ref: experiment/ha-planner-array-hotloop
          - label: hotloop-cost-delta
            ref: experiment/ha-planner-hotloop-cost-delta
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      EV_PLANNER_RUN_PERFORMANCE: "1"
      EV_PLANNER_RUN_PROFILE: "0"

    steps:
      - name: Checkout benchmark revision
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Use current benchmark test
        run: |
          git fetch origin experiment/array-dp:refs/remotes/origin/experiment/array-dp
          git show origin/experiment/array-dp:tests/test_quarter_hour_optimizer_performance.py > tests/test_quarter_hour_optimizer_performance.py

      - name: Run benchmark
        run: |
          python -m pytest -q tests/test_quarter_hour_optimizer_performance.py::test_57kwh_quarter_hour_dp_performance -s


  performance-ab-hotloop-action-limit:
    name: Performance A/B - hotloop-action-limit ${{ matrix.label }}
    if: github.ref == 'refs/heads/experiment/ha-planner-hotloop-action-limit' || (github.event_name == 'pull_request' && github.head_ref == 'experiment/ha-planner-hotloop-action-limit')
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: hotloop-cost-delta
            ref: experiment/ha-planner-hotloop-cost-delta
          - label: hotloop-action-limit
            ref: experiment/ha-planner-hotloop-action-limit
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      EV_PLANNER_RUN_PERFORMANCE: "1"
      EV_PLANNER_RUN_PROFILE: "0"

    steps:
      - name: Checkout benchmark revision
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Use current benchmark test
        run: |
          git fetch origin experiment/array-dp:refs/remotes/origin/experiment/array-dp
          git show origin/experiment/array-dp:tests/test_quarter_hour_optimizer_performance.py > tests/test_quarter_hour_optimizer_performance.py

      - name: Run benchmark
        run: |
          python -m pytest -q tests/test_quarter_hour_optimizer_performance.py::test_57kwh_quarter_hour_dp_performance -s
  production-planner-ab:
    name: Production planner A/B - ${{ matrix.label }}
    if: github.ref == 'refs/heads/experiment/ha-planner-fast-loop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: v2.0.0
            ref: v2.0.0
          - label: ha-planner-fast-loop
            ref: experiment/ha-planner-fast-loop
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      EV_PLANNER_RUN_PERFORMANCE: "1"

    steps:
      - name: Checkout benchmark revision
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Use production benchmark test
        run: |
          git fetch origin experiment/ha-planner-fast-loop:refs/remotes/origin/experiment/ha-planner-fast-loop
          git show origin/experiment/ha-planner-fast-loop:tests/test_production_planner_performance.py > tests/test_production_planner_performance.py

      - name: Run production planner benchmark
        run: |
          python -m pytest -q tests/test_production_planner_performance.py::test_production_planner_performance -s

  dp-memory-profile:
    name: DP memory scaling profile
    if: github.ref == 'refs/heads/experiment/dp-memory-profile'
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      EV_PLANNER_RUN_MEMORY_PROFILE: "1"
      EV_PLANNER_MEMORY_PROFILE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Run memory scaling profile
        run: |
          echo "Starting DP memory scaling profile"
          python -m pytest -q tests/test_quarter_hour_optimizer_performance.py::test_dp_memory_profile_scaling -s

  test:
    name: Tests and linting
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      EV_PLANNER_RUN_PERFORMANCE: ${{ inputs.performance == true && '1' || '0' }}
      EV_PLANNER_RUN_PROFILE: ${{ inputs.performance == true && '1' || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements_test.txt

      - name: Show performance configuration
        run: |
          echo "workflow_dispatch performance input: ${{ inputs.performance }}"
          echo "EV_PLANNER_RUN_PERFORMANCE: $EV_PLANNER_RUN_PERFORMANCE"

      - name: Profile planner performance
        if: env.EV_PLANNER_RUN_PERFORMANCE == '1'
        run: |
          python -m pytest -q tests/test_quarter_hour_optimizer_performance.py::test_57kwh_quarter_hour_dp_regression -s

      - name: Run pytest
        run: python -m pytest -q ${{ inputs.performance == true && '-s' || '' }}

      - name: Run Ruff
        run: python -m ruff check .
