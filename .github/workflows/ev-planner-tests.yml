name: EV Planner Tests

run-name: EV Planner Tests - performance=${{ inputs.performance }}

on:
  push:
    branches:
      - main
      - experiment/quarter-hour-dp
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      performance:
        description: "Run the 57 kWh quarter-hour performance benchmark"
        required: false
        default: false
        type: boolean

jobs:
  performance-ab:
    name: Performance A/B - ${{ matrix.label }}
    if: inputs.performance == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            ref: 3880c75126abaf49ffe900efe76999cd7c497225
          - label: candidate
            ref: experiment/quarter-hour-dp
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      EV_PLANNER_RUN_PERFORMANCE: "1"
      EV_PLANNER_RUN_PROFILE: "0"

    steps:
      - name: Checkout benchmark revision
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Use current benchmark test
        if: matrix.label == 'baseline'
        run: |
          git fetch origin experiment/quarter-hour-dp:refs/remotes/origin/experiment/quarter-hour-dp
          git show origin/experiment/quarter-hour-dp:tests/test_zonneplan_quarter_hour_prices.py > tests/test_zonneplan_quarter_hour_prices.py

      - name: Run benchmark
        run: |
          python -m pytest -q tests/test_zonneplan_quarter_hour_prices.py::test_57kwh_quarter_hour_dp_regression -s

  test:
    name: Tests and linting
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      EV_PLANNER_RUN_PERFORMANCE: ${{ inputs.performance == true && '1' || '0' }}
      EV_PLANNER_RUN_PROFILE: ${{ inputs.performance == true && '1' || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements_test.txt

      - name: Show performance configuration
        run: |
          echo "workflow_dispatch performance input: ${{ inputs.performance }}"
          echo "EV_PLANNER_RUN_PERFORMANCE: $EV_PLANNER_RUN_PERFORMANCE"

      - name: Profile planner performance
        if: env.EV_PLANNER_RUN_PERFORMANCE == '1'
        run: |
          python -m pytest -q tests/test_zonneplan_quarter_hour_prices.py::test_57kwh_quarter_hour_planning_regression -s

      - name: Run pytest
        run: python -m pytest -q ${{ inputs.performance == true && '-s' || '' }}

      - name: Run Ruff
        run: python -m ruff check .
