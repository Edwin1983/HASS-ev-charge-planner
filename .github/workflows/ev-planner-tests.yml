name: EV Planner Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Tests and linting
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check .

  core-integration:
    name: Home Assistant Core integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout Home Assistant Core
        uses: actions/checkout@v5
        with:
          repository: home-assistant/core
          path: ha-core
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Home Assistant Core test dependencies
        working-directory: ha-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r <(sed '/^hass-nabucasa==/d' requirements.txt) -r requirements_test.txt bleak-retry-connector==4.7.1

      - name: Copy EV Charge Planner into Home Assistant Core
        run: |
          rm -rf ha-core/homeassistant/components/ev_planner
          cp -R homeassistant/components/ev_planner ha-core/homeassistant/components/ev_planner
          mkdir -p ha-core/tests/components/ev_planner
          sed -e 's/from pytest_homeassistant_custom_component.common import MockConfigEntry/from tests.common import MockConfigEntry/' -e 's/from custom_components.ev_planner/from homeassistant.components.ev_planner/' -e 's/, enable_custom_integrations//' tests/components/ev_planner/test_ev_planner_integration.py > ha-core/tests/components/ev_planner/test_ev_planner_integration.py

      - name: Run Core integration tests
        working-directory: ha-core
        run: python -m pytest -q tests/components/ev_planner/test_ev_planner_integration.py
