name: EV Planner Tests

concurrency:
  group: ev-planner-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Core integration changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed-files
          else
            if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
              git ls-tree -r --name-only HEAD > /tmp/changed-files
            else
              git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > /tmp/changed-files
            fi
          fi

          if grep -Eq '^(homeassistant/components/ev_planner/|\.github/workflows/ev-planner-tests\.yml$)' /tmp/changed-files; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests and linting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Run pytest
        run: python -m pytest -q tests/test_*.py

      - name: Run Ruff
        run: python -m ruff check .

  core-integration:
    name: Home Assistant Core integration tests
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout Home Assistant Core
        uses: actions/checkout@v5
        with:
          repository: home-assistant/core
          path: ha-core
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            ha-core/requirements.txt
            ha-core/requirements_test.txt
            ha-core/homeassistant/package_constraints.txt
            .github/workflows/ev-planner-tests.yml

      - name: Restore Home Assistant Core virtual environment
        id: core-cache
        uses: actions/cache@v4
        with:
          path: ha-core/.venv
          key: ha-core-venv-${{ runner.os }}-py3.14-${{ hashFiles('ha-core/requirements.txt', 'ha-core/requirements_test.txt', 'ha-core/homeassistant/package_constraints.txt', '.github/workflows/ev-planner-tests.yml') }}

      - name: Create and populate Home Assistant Core virtual environment
        working-directory: ha-core
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements_test.txt paho-mqtt==2.1.0

      - name: Copy EV Charge Planner into Home Assistant Core
        run: |
          rm -rf ha-core/homeassistant/components/ev_planner
          cp -R homeassistant/components/ev_planner ha-core/homeassistant/components/ev_planner
          mkdir -p ha-core/tests/ev_planner
          sed -e 's/from pytest_homeassistant_custom_component.common import MockConfigEntry/from tests.common import MockConfigEntry/' \
              -e 's/from custom_components.ev_planner/from homeassistant.components.ev_planner/' \
              -e 's/, enable_custom_integrations: None//' \
              tests/components/ev_planner/test_ev_planner_integration.py \
              > ha-core/tests/ev_planner/test_ev_planner_integration.py
          cp tests/components/ev_planner/test_config_flow.py \
              ha-core/tests/ev_planner/test_config_flow.py

      - name: Run Core integration tests with coverage
        working-directory: ha-core
        run: .venv/bin/python -m pytest --cov=homeassistant/components/ev_planner --cov-report=term-missing -q tests/ev_planner
