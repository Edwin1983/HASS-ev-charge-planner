name: EV Planner Tests

run-name: EV Planner Tests - performance=${{ inputs.performance }}

on:
  push:
    branches:
      - main
      - experiment/quarter-hour-dp
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      performance:
        description: "Run the 57 kWh quarter-hour performance benchmark"
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Tests and linting
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      EV_PLANNER_RUN_PERFORMANCE: ${{ inputs.performance == true && '1' || '0' }}
      EV_PLANNER_RUN_PROFILE: ${{ inputs.performance == true && '1' || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements_test.txt

      - name: Show performance configuration
        run: |
          echo "workflow_dispatch performance input: ${{ inputs.performance }}"
          echo "EV_PLANNER_RUN_PERFORMANCE: $EV_PLANNER_RUN_PERFORMANCE"

      - name: Run baseline performance benchmark
        if: env.EV_PLANNER_RUN_PERFORMANCE == '1'
        run: |
          git worktree add --detach /tmp/ev-planner-baseline 9431846a36e4e445089b41baeb9a7a3ebd43abbf
          cp tests/test_zonneplan_quarter_hour_prices.py /tmp/ev-planner-baseline/tests/test_zonneplan_quarter_hour_prices.py
          cd /tmp/ev-planner-baseline
          python -m pytest -q tests/test_zonneplan_quarter_hour_prices.py::test_57kwh_quarter_hour_planning_regression -s
          cd -
          git worktree remove --force /tmp/ev-planner-baseline

      - name: Run previous best performance benchmark
        if: env.EV_PLANNER_RUN_PERFORMANCE == '1'
        run: |
          git worktree add --detach /tmp/ev-planner-best  cb054bfe633724aaa8cb7a6862412753728e00c4
          cp tests/test_zonneplan_quarter_hour_prices.py /tmp/ev-planner-best/tests/test_zonneplan_quarter_hour_prices.py
          cd /tmp/ev-planner-best
          python -m pytest -q tests/test_zonneplan_quarter_hour_prices.py::test_57kwh_quarter_hour_planning_regression -s
          cd -
          git worktree remove --force /tmp/ev-planner-best

      - name: Profile planner performance
        if: env.EV_PLANNER_RUN_PERFORMANCE == '1'
        run: |
          python -m pytest -q tests/test_zonneplan_quarter_hour_prices.py::test_57kwh_quarter_hour_planning_regression -s

      - name: Run pytest
        run: python -m pytest -q ${{ inputs.performance == true && '-s' || '' }}

      - name: Run Ruff
        run: python -m ruff check .
