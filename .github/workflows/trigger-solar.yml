name: Trigger solar implementation

on:
  push:
    branches:
      - feature/solar-charging

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch implementation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/Edwin1983/HASS-ev-charge-planner/actions/workflows/implement-solar.yml/dispatches \
            -f ref=feature/solar-charging
