  status: exempt
  comment: The integration does not establish an external connection during configuration.
test-before-setup: done
unique-config-entry: done

# Silver

action-exceptions: done
config-entry-unloading: done
docs-configuration-parameters: todo
docs-installation-parameters: todo
entity-unavailable: todo
integration-owner: done
log-when-unavailable:
  status: exempt
  comment: The integration has no external device or network connection whose availability is monitored.
parallel-updates: todo
reauthentication-flow:
  status: exempt
  comment: The integration has no authentication flow.
test-coverage: todo

# Gold

devices:
  status: exempt
  comment: The integration provides service and planning entities and does not represent a physical device.
diagnostics: todo
discovery:
  status: exempt
  comment: The integration has no discoverable external device or service.
discovery-update-info:
  status: exempt
  comment: The integration has no discoverable external device or service.
docs-data-update: todo
docs-examples: todo
docs-known-limitations: todo
docs-supported-devices:
  status: exempt
  comment: The integration does not directly integrate a physical device.
docs-supported-functions: todo
docs-troubleshooting: todo
docs-use-cases: todo
dynamic-devices:
  status: exempt
  comment: The integration does not create devices dynamically.
entity-category: todo
entity-device-class: todo
entity-disabled-by-default: todo
entity-translations: todo
exception-translations: todo
icon-translations: todo
reconfiguration-flow:
  status: exempt
  comment: Configuration is service- and entity-based; there is no external connection that can be reconfigured.
repair-issues: todo
stale-devices:
  status: exempt
  comment: The integration does not create devices.

# Platinum

async-dependency:
  status: exempt
  comment: The integration does not use an asynchronous third-party dependency.
inject-websession:
  status: exempt
  comment: The integration does not use an HTTP client dependency requiring a Home Assistant websession.
strict-typing: todo
